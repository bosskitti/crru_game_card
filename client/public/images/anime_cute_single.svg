<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgAnimeSingle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff66" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#072016" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030c08" stop-opacity="0.99"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="animeGlowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="hairGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff99"/>
      <stop offset="100%" stop-color="#00804d"/>
    </linearGradient>

    <linearGradient id="eyeGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00ff66"/>
      <stop offset="100%" stop-color="#00993d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgAnimeSingle)" />

  <!-- Cyber Grid -->
  <g stroke="#00ff66" stroke-width="1" opacity="0.15">
    <path d="M0 100 H500 M0 200 H500 M0 300 H500 M0 400 H500" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500" />
  </g>

  <!-- FLOATING CUTE AI CHIBI ROBOT (SIDE PET) -->
  <g transform="translate(380, 170)">
    <circle cx="0" cy="-45" r="5" fill="#00ff66" filter="url(#animeGlowGreen)"/>
    <line x1="0" y1="-45" x2="0" y2="-30" stroke="#00ff66" stroke-width="3"/>
    <rect x="-30" y="-30" width="60" height="50" rx="14" fill="#0b2819" stroke="#00ff66" stroke-width="3" filter="url(#animeGlowGreen)"/>
    <rect x="-22" y="-22" width="44" height="34" rx="8" fill="#030d07"/>
    <ellipse cx="-10" cy="-6" rx="6" ry="9" fill="#00ff66" filter="url(#animeGlowGreen)"/>
    <ellipse cx="10" cy="-6" rx="6" ry="9" fill="#00ff66" filter="url(#animeGlowGreen)"/>
    <path d="M-6 4 Q0 10 6 4" stroke="#00ff66" stroke-width="2" fill="none"/>
  </g>

  <!-- CUTE ANIME GIRL CHARACTER (CENTER) -->
  <g transform="translate(230, 240)">
    <!-- Long Twin Tails Hair (Back) -->
    <path d="M-80 -40 Q-120 40 -90 120 Q-70 60 -50 0 Z" fill="url(#hairGreen)" />
    <path d="M80 -40 Q120 40 90 120 Q70 60 50 0 Z" fill="url(#hairGreen)" />

    <!-- Cat-Ear VR Headset -->
    <path d="M-55 -80 L-35 -130 L-10 -70 Z" fill="#00ff66" filter="url(#animeGlowGreen)"/>
    <path d="M10 -70 L35 -130 L55 -80 Z" fill="#00ff66" filter="url(#animeGlowGreen)"/>

    <!-- Head & Face -->
    <path d="M-50 -60 Q0 -90 50 -60 Q65 10 0 55 Q-65 10 -50 -60 Z" fill="#fff0e6"/>

    <!-- Anime Hair Bangs (Front) -->
    <path d="M-55 -60 Q-25 -90 0 -55 Q25 -90 55 -60 L45 -30 Q20 -50 0 -35 Q-20 -50 -45 -30 Z" fill="url(#hairGreen)"/>

    <!-- Headset Band -->
    <path d="M-52 -55 Q0 -85 52 -55" stroke="#00ff66" stroke-width="6" fill="none" filter="url(#animeGlowGreen)"/>

    <!-- Kawaii Anime Eyes (Huge & Cute) -->
    <!-- Left Eye -->
    <g transform="translate(-25, -20)">
      <ellipse cx="0" cy="0" rx="16" ry="24" fill="#1a202c"/>
      <ellipse cx="0" cy="2" rx="13" ry="19" fill="url(#eyeGreen)" />
      <circle cx="-5" cy="-8" r="6" fill="#ffffff"/>
      <circle cx="5" cy="6" r="3.5" fill="#ffffff"/>
      <!-- Eyelashes -->
      <path d="M-18 -20 Q-5 -30 18 -20" stroke="#1a202c" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Right Eye -->
    <g transform="translate(25, -20)">
      <ellipse cx="0" cy="0" rx="16" ry="24" fill="#1a202c"/>
      <ellipse cx="0" cy="2" rx="13" ry="19" fill="url(#eyeGreen)" />
      <circle cx="-5" cy="-8" r="6" fill="#ffffff"/>
      <circle cx="5" cy="6" r="3.5" fill="#ffffff"/>
      <!-- Eyelashes -->
      <path d="M-18 -20 Q-5 -30 18 -20" stroke="#1a202c" stroke-width="4" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Nose & Smile -->
    <circle cx="0" cy="5" r="1.5" fill="#d69e2e"/>
    <path d="M-10 16 Q0 26 10 16" stroke="#ff4d4d" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Anime Pink Blush -->
    <ellipse cx="-35" cy="5" rx="10" ry="5" fill="#ff9999" opacity="0.7"/>
    <ellipse cx="35" cy="5" rx="10" ry="5" fill="#ff9999" opacity="0.7"/>

    <!-- Cyber Jacket Body -->
    <path d="M-45 45 L45 45 L60 140 L-60 140 Z" fill="#092416" stroke="#00ff66" stroke-width="3" filter="url(#animeGlowGreen)"/>
    <path d="M-20 45 L0 140 L20 45" stroke="#00ff66" stroke-width="2" fill="none"/>

    <!-- Holding Holographic Cards in Hand -->
    <g transform="translate(-15, 60) rotate(-15)">
      <rect width="35" height="55" rx="7" fill="#00ff66" opacity="0.9" stroke="#ffffff" stroke-width="2" filter="url(#animeGlowGreen)"/>
      <text x="17" y="34" font-size="20" text-anchor="middle">🛡️</text>
    </g>
    <g transform="translate(10, 55) rotate(12)">
      <rect width="35" height="55" rx="7" fill="#ffe600" opacity="0.9" stroke="#ffffff" stroke-width="2" filter="url(#animeGlowGreen)"/>
      <text x="17" y="34" font-size="20" text-anchor="middle">⚡</text>
    </g>
  </g>

  <!-- Banner Badge Overlay -->
  <rect x="70" y="425" width="360" height="42" rx="21" fill="#00ff66" filter="url(#animeGlowGreen)"/>
  <text x="250" y="451" font-family="sans-serif" font-weight="900" font-size="15" text-anchor="middle" fill="#030c08" letter-spacing="1">👧 CUTE ANIME GIRL VS AI BOT 🤖</text>
</svg>
