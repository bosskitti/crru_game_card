<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgKidsPvp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#071b28" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#030a10" stop-opacity="0.99"/>
    </radialGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="tableGlowPvp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#ff0055" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Layer -->
  <rect width="500" height="500" rx="30" fill="url(#bgKidsPvp)" />

  <!-- Cyber Grid background -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.15">
    <path d="M0 100 H500 M0 200 H500 M0 300 H500 M0 400 H500" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500" />
  </g>

  <!-- CYBER BATTLE TABLE -->
  <ellipse cx="250" cy="320" rx="210" ry="70" fill="#040c14" stroke="#00f0ff" stroke-width="3" filter="url(#glowCyan)"/>
  <ellipse cx="250" cy="320" rx="190" ry="55" fill="url(#tableGlowPvp)"/>

  <!-- HOLOGRAPHIC CARDS ON TABLE -->
  <g transform="translate(190, 295) rotate(-12)">
    <rect width="45" height="65" rx="8" fill="#00f0ff" opacity="0.8" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="40" font-size="20" text-anchor="middle">🗡️</text>
  </g>
  <g transform="translate(265, 295) rotate(15)">
    <rect width="45" height="65" rx="8" fill="#ff0055" opacity="0.8" stroke="#ffffff" stroke-width="2"/>
    <text x="22" y="40" font-size="20" text-anchor="middle">💥</text>
  </g>

  <!-- LEFT: CUTE BOY HACKER KID (PLAYER 1) -->
  <g transform="translate(130, 240)">
    <!-- Boy Hair (Spiky Cyberpunk Hair) -->
    <path d="M-45 -70 Q0 -110 45 -70 Q55 -20 40 30 Q0 40 -40 30 Z" fill="#2b6cb0"/>
    <circle cx="0" cy="-30" r="42" fill="#ffdbac"/>
    
    <!-- Bangs -->
    <path d="M-42 -40 Q-20 -75 0 -45 Q20 -75 42 -40 L35 -20 Q0 -40 -35 -20 Z" fill="#1a365d"/>

    <!-- Cyber Headset -->
    <rect x="-48" y="-40" width="12" height="24" rx="4" fill="#00f0ff" filter="url(#glowCyan)"/>
    <rect x="36" y="-40" width="12" height="24" rx="4" fill="#00f0ff" filter="url(#glowCyan)"/>
    <path d="M-42 -42 Q0 -75 42 -42" stroke="#00f0ff" stroke-width="4" fill="none"/>

    <!-- Kawaii Eyes -->
    <ellipse cx="-16" cy="-30" rx="8" ry="12" fill="#1a365d"/>
    <circle cx="-18" cy="-34" r="3" fill="#ffffff"/>
    <ellipse cx="16" cy="-30" rx="8" ry="12" fill="#1a365d"/>
    <circle cx="14" cy="-34" r="3" fill="#ffffff"/>

    <!-- Smile & Blush -->
    <path d="M-8 -12 Q0 -4 8 -12" stroke="#dd6b20" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="-26" cy="-18" rx="7" ry="4" fill="#fbd38d"/>
    <ellipse cx="26" cy="-18" rx="7" ry="4" fill="#fbd38d"/>

    <!-- Hoodie & Hand with Cards -->
    <path d="M-35 15 L35 15 L45 80 L-45 80 Z" fill="#00f0ff" filter="url(#glowCyan)"/>
    
    <g transform="translate(-5, 20) rotate(-15)">
      <rect width="25" height="40" rx="5" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
      <text x="12" y="25" font-size="14" text-anchor="middle">🎴</text>
    </g>
    <g transform="translate(10, 18) rotate(10)">
      <rect width="25" height="40" rx="5" fill="#ffffff" stroke="#00f0ff" stroke-width="2"/>
      <text x="12" y="25" font-size="14" text-anchor="middle">🗡️</text>
    </g>
  </g>

  <!-- RIGHT: CUTE GIRL HACKER KID (PLAYER 2) -->
  <g transform="translate(370, 240)">
    <!-- Girl Hair (Twin Tails / Crimson Hood) -->
    <path d="M-55 -40 Q-70 20 -50 60 Q-40 0 -40 -30 Z" fill="#9b2c2c"/>
    <path d="M55 -40 Q70 20 50 60 Q40 0 40 -30 Z" fill="#9b2c2c"/>
    <path d="M-45 -70 Q0 -110 45 -70 Q55 -20 40 30 Q0 40 -40 30 Z" fill="#c53030"/>
    <circle cx="0" cy="-30" r="42" fill="#ffdbac"/>
    
    <!-- Bangs -->
    <path d="M-42 -40 Q-20 -70 0 -45 Q20 -70 42 -40 L35 -20 Q0 -40 -35 -20 Z" fill="#822727"/>

    <!-- Cyber Headset Pink -->
    <rect x="-48" y="-40" width="12" height="24" rx="4" fill="#ff0055" filter="url(#glowPink)"/>
    <rect x="36" y="-40" width="12" height="24" rx="4" fill="#ff0055" filter="url(#glowPink)"/>
    <path d="M-42 -42 Q0 -75 42 -42" stroke="#ff0055" stroke-width="4" fill="none"/>

    <!-- Kawaii Eyes -->
    <ellipse cx="-16" cy="-30" rx="8" ry="12" fill="#742a2a"/>
    <circle cx="-18" cy="-34" r="3" fill="#ffffff"/>
    <ellipse cx="16" cy="-30" rx="8" ry="12" fill="#742a2a"/>
    <circle cx="14" cy="-34" r="3" fill="#ffffff"/>

    <!-- Smile & Blush -->
    <path d="M-8 -12 Q0 -4 8 -12" stroke="#dd6b20" stroke-width="3" fill="none" stroke-linecap="round"/>
    <ellipse cx="-26" cy="-18" rx="7" ry="4" fill="#feb2b2"/>
    <ellipse cx="26" cy="-18" rx="7" ry="4" fill="#feb2b2"/>

    <!-- Pink Hoodie & Hand with Cards -->
    <path d="M-35 15 L35 15 L45 80 L-45 80 Z" fill="#ff0055" filter="url(#glowPink)"/>
    
    <g transform="translate(-15, 18) rotate(-10)">
      <rect width="25" height="40" rx="5" fill="#ffffff" stroke="#ff0055" stroke-width="2"/>
      <text x="12" y="25" font-size="14" text-anchor="middle">💥</text>
    </g>
    <g transform="translate(0, 20) rotate(15)">
      <rect width="25" height="40" rx="5" fill="#ffffff" stroke="#ff0055" stroke-width="2"/>
      <text x="12" y="25" font-size="14" text-anchor="middle">🎴</text>
    </g>
  </g>

  <!-- VS SPARK IN CENTER -->
  <circle cx="250" cy="220" r="26" fill="#ff0055" filter="url(#glowPink)"/>
  <circle cx="250" cy="220" r="20" fill="#030a10" stroke="#00f0ff" stroke-width="2"/>
  <text x="250" y="227" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#ffffff" filter="url(#glowCyan)">VS</text>

  <!-- Banner Overlay Badge -->
  <rect x="70" y="425" width="360" height="42" rx="21" fill="#00f0ff" filter="url(#glowCyan)"/>
  <text x="250" y="451" font-family="sans-serif" font-weight="900" font-size="15" text-anchor="middle" fill="#030a10" letter-spacing="1">👦 KIDS MULTIPLAYER CARD DUEL 👧</text>
</svg>
