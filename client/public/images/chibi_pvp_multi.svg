<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGlowPvp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#061a28" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#03080e" stop-opacity="0.98"/>
    </radialGradient>
    
    <linearGradient id="cyanHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143b44"/>
      <stop offset="100%" stop-color="#05141a"/>
    </linearGradient>

    <linearGradient id="pinkHead" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#44142b"/>
      <stop offset="100%" stop-color="#1a0510"/>
    </linearGradient>

    <filter id="neonGlowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="neonGlowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="30" fill="url(#bgGlowPvp)" />

  <!-- Cyber Grid Lines Background -->
  <g stroke="#00f0ff" stroke-width="1" opacity="0.15">
    <path d="M0 100 H500 M0 200 H500 M0 300 H500 M0 400 H500" />
    <path d="M100 0 V500 M200 0 V500 M300 0 V500 M400 0 V500" />
  </g>

  <!-- LEFT CUTE CYBER CAT (PLAYER 1 - CYAN) -->
  <g transform="translate(140, 230)">
    <!-- Cat Ears -->
    <path d="M-60 -70 L-30 -110 L-10 -60 Z" fill="#00f0ff" filter="url(#neonGlowCyan)"/>
    <path d="M10 -60 L30 -110 L60 -70 Z" fill="#00f0ff" filter="url(#neonGlowCyan)"/>

    <!-- Head -->
    <rect x="-80" y="-70" width="160" height="130" rx="35" fill="url(#cyanHead)" stroke="#00f0ff" stroke-width="4" filter="url(#neonGlowCyan)"/>

    <!-- Visor -->
    <rect x="-65" y="-55" width="130" height="85" rx="20" fill="#030c12" stroke="#00f0ff" stroke-width="2"/>

    <!-- Kawaii Eyes -->
    <ellipse cx="-30" cy="-20" rx="18" ry="24" fill="#00f0ff" filter="url(#neonGlowCyan)" />
    <circle cx="-35" cy="-28" r="6" fill="#ffffff" />
    
    <ellipse cx="30" cy="-20" rx="18" ry="24" fill="#00f0ff" filter="url(#neonGlowCyan)" />
    <circle cx="25" cy="-28" r="6" fill="#ffffff" />

    <path d="M-12 5 Q0 18 12 5" stroke="#00f0ff" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Tag -->
    <rect x="-40" y="30" width="80" height="22" rx="11" fill="#00f0ff" />
    <text x="0" y="45" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#030c12">AGENT 01</text>
  </g>

  <!-- CENTER CLASH SPARK (VS) -->
  <g transform="translate(250, 210)">
    <circle cx="0" cy="0" r="38" fill="#ff0055" filter="url(#neonGlowPink)" />
    <circle cx="0" cy="0" r="30" fill="#03080e" stroke="#00f0ff" stroke-width="3" />
    <text x="0" y="8" font-family="sans-serif" font-weight="900" font-size="22" text-anchor="middle" fill="#ffffff" filter="url(#neonGlowCyan)">VS</text>
  </g>

  <!-- RIGHT CUTE CYBER FOX (PLAYER 2 - CRIMSON) -->
  <g transform="translate(360, 230)">
    <!-- Fox Ears -->
    <path d="M-60 -70 L-40 -120 L-10 -60 Z" fill="#ff0055" filter="url(#neonGlowPink)"/>
    <path d="M10 -60 L40 -120 L60 -70 Z" fill="#ff0055" filter="url(#neonGlowPink)"/>

    <!-- Head -->
    <rect x="-80" y="-70" width="160" height="130" rx="35" fill="url(#pinkHead)" stroke="#ff0055" stroke-width="4" filter="url(#neonGlowPink)"/>

    <!-- Visor -->
    <rect x="-65" y="-55" width="130" height="85" rx="20" fill="#12030a" stroke="#ff0055" stroke-width="2"/>

    <!-- Kawaii Eyes -->
    <ellipse cx="-30" cy="-20" rx="18" ry="24" fill="#ff0055" filter="url(#neonGlowPink)" />
    <circle cx="-35" cy="-28" r="6" fill="#ffffff" />
    
    <ellipse cx="30" cy="-20" rx="18" ry="24" fill="#ff0055" filter="url(#neonGlowPink)" />
    <circle cx="25" cy="-28" r="6" fill="#ffffff" />

    <path d="M-12 5 Q0 18 12 5" stroke="#ff0055" stroke-width="4" fill="none" stroke-linecap="round" />

    <!-- Tag -->
    <rect x="-40" y="30" width="80" height="22" rx="11" fill="#ff0055" />
    <text x="0" y="45" font-family="sans-serif" font-weight="900" font-size="10" text-anchor="middle" fill="#ffffff">AGENT 02</text>
  </g>

  <!-- Banner Badge Overlay -->
  <rect x="100" y="420" width="300" height="45" rx="22" fill="#00f0ff" filter="url(#neonGlowCyan)"/>
  <text x="250" y="448" font-family="sans-serif" font-weight="900" font-size="16" text-anchor="middle" fill="#030c12" letter-spacing="2">⚔️ REAL-TIME PVP MULTIPLAYER</text>
</svg>
